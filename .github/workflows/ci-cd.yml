name: CI/CD

on:
  push:
    branches: [master, developer]
  pull_request:
    branches: [master, developer]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: ./mvnw -B package

      - name: Upload Beanstalk bundle
        uses: actions/upload-artifact@v4
        with:
          name: beanstalk-bundle
          path: target/*-beanstalk.zip
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Elastic Beanstalk
    needs: build
    # only pushes (or manual runs) on master deploy; PRs and developer just build and test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: beanstalk-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # for AWS OIDC
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EB_APPLICATION: ${{ vars.EB_APPLICATION }}
      EB_ENVIRONMENT: ${{ vars.EB_ENVIRONMENT }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: beanstalk-bundle

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload application version
        run: |
          VERSION_LABEL="${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          echo "VERSION_LABEL=$VERSION_LABEL" >> "$GITHUB_ENV"

          # Beanstalk's own S3 bucket for this account and region (created if missing)
          BUCKET=$(aws elasticbeanstalk create-storage-location --query S3Bucket --output text)
          KEY="$EB_APPLICATION/$VERSION_LABEL.zip"

          aws s3 cp *-beanstalk.zip "s3://$BUCKET/$KEY"
          aws elasticbeanstalk create-application-version \
            --application-name "$EB_APPLICATION" \
            --version-label "$VERSION_LABEL" \
            --description "${GITHUB_SHA}" \
            --source-bundle S3Bucket="$BUCKET",S3Key="$KEY"

      - name: Deploy
        run: |
          aws elasticbeanstalk update-environment \
            --environment-name "$EB_ENVIRONMENT" \
            --version-label "$VERSION_LABEL"
          aws elasticbeanstalk wait environment-updated \
            --environment-names "$EB_ENVIRONMENT"

      - name: Check health
        run: |
          read -r STATUS HEALTH DEPLOYED <<< "$(aws elasticbeanstalk describe-environments \
            --environment-names "$EB_ENVIRONMENT" \
            --query 'Environments[0].[Status,Health,VersionLabel]' --output text)"
          echo "Status: $STATUS, health: $HEALTH, version: $DEPLOYED"
          if [ "$DEPLOYED" != "$VERSION_LABEL" ] || [ "$HEALTH" = "Red" ]; then
            echo "::error::Deployment of $VERSION_LABEL failed (running $DEPLOYED, health $HEALTH)"
            exit 1
          fi
