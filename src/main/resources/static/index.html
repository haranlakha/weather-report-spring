<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Report Spring</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Weather Report Program</h1>
<div style="margin-bottom: 30px;">
    <label for="locationInput"></label><input type="text" id="locationInput" placeholder="Input Location">
    <button onclick="getWeather()">Get Weather</button>
</div>

<div id="error"></div>

<div id="weatherResult">
    <div class="weather-card">
        <h2 id="cityName" class="city-name">City</h2>
        <div id="temperature" class="temperature">--°C</div>
        <div id="description" class="description">Description</div>
    </div>
</div>

<script src=weather.js></script>
</body>
</html>
