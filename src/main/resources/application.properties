spring.application.name=weather-report-spring
# Elastic Beanstalk passes the port to listen on in PORT; default to 8080 locally
server.port=${PORT:8080}
# Use the client IP from X-Forwarded-For (set by Beanstalk's nginx and load balancer) for rate limiting.
# Only proxies on private/loopback addresses are trusted, so clients can't spoof it.
server.forward-headers-strategy=native

# Requests to /api/weather allowed per minute, per client IP and in total.
# Keep the total under the OpenWeatherMap plan's limit (60 calls/minute on the free plan).
rate-limit.per-client-per-minute=10
rate-limit.total-per-minute=50
